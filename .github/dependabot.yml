version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    exclude-paths:
      - "requirements.txt"
      - "requirements.dev.txt"
    assignees: ["johnlettman"]
    open-pull-requests-limit: 2
    schedule:
      time: "10:00"
      timezone: "America/New_York"
      interval: "daily"

  - package-ecosystem: "pip"
    directory: "/"
    exclude-paths:
      - "requirements.txt"
      - "requirements.dev.txt"
    assignees: ["johnlettman"]
    open-pull-requests-limit: 10
    schedule:
      time: "10:00"
      timezone: "America/New_York"
      interval: "daily"
